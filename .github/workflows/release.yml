name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package release binaries
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp .pio/build/solderingpen/firmware.bin "dist/PTS200_${VERSION_TAG}_update.bin"
          python ~/.platformio/packages/tool-esptoolpy/esptool.py \
            --chip esp32s2 merge_bin \
            -o "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 .pio/build/solderingpen/bootloader.bin \
            0x8000 .pio/build/solderingpen/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/solderingpen/firmware.bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          sed "s/__TAG__/${VERSION_TAG}/g" <<'EOF' > dist/release_notes.md
          Release __TAG__ adds immediate staged feedback when holding the center button so you do not accidentally overshoot Settings into the 90° Spirit Level HUD.

          ### What Changed in __TAG__
          * **Staged 500 ms Setup Cue:** Holding the center button plays 1 crisp `beep()` and shows `Release: Setup` on the OLED as soon as `500 ms` is crossed, removing the silent dead zone before `2500 ms`
          * **Live Hold Progress Bar:** Displays a `Hold: 90 Level` progress bar from `500 ms` to `2500 ms` while temperature sensing and heater control stay active (`2500 ms` double beeps into Level Mode)
          * **Clean Audio Distinction:** Removed duplicate Setup entry beep so Setup uses 1 beep at `500 ms` and Spirit Level uses 2 beeps at `2500 ms`
          * **Preserved Settings:** Keeps `VERSION_NUM = 500` so upgrading from `v5.0.0` / `v5.1.0` preserves saved tip calibrations and preferences

          ### Binary Files
          * `PTS200___TAG___update.bin`: Drag and drop onto `ESP32-FWMSC` via `Setup` → `Update FW` for normal upgrades
          * `PTS200___TAG___factory.bin`: Full merged flash image starting at `0x0000` for fresh flashes or recovery
          EOF
          gh release create "$VERSION_TAG" \
            "dist/PTS200_${VERSION_TAG}_update.bin" \
            "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --title "$VERSION_TAG" \
            --latest \
            --notes-file dist/release_notes.md
