name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package release binaries
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp .pio/build/solderingpen/firmware.bin "dist/PTS200_${VERSION_TAG}_update.bin"
          python ~/.platformio/packages/tool-esptoolpy/esptool.py \
            --chip esp32s2 merge_bin \
            -o "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 .pio/build/solderingpen/bootloader.bin \
            0x8000 .pio/build/solderingpen/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/solderingpen/firmware.bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          sed "s/__TAG__/${VERSION_TAG}/g" <<'EOF' > dist/release_notes.md
          Release __TAG__ optimizes display I2C throughput, CPU thermal efficiency, and hardware fault protection while keeping the proven bang bang thermal profile intact.

          ### What Changed in __TAG__
          * **OLED Dirty Frame Skipping & 30 Hz Level Cap:** Skips redundant `128x64` I2C flushes when telemetry is unchanged, stops polling OLED during screen off, removes duplicate `initDisplay()`, and sets explicit `u8g2.setBusClock(400000)`
          * **IMU & I2C Bus Optimization:** Rate limits LIS2DH12 temperature reads to 250 ms with missing sensor guarding (`accelPresent`) and `Wire.setTimeOut(50)` recovery
          * **5 ms Settle Overlap & Steady 20 Hz Sensor Cadence:** Overlaps IMU polling and `Vin` sampling inside the 5 ms OpAmp discharge window and paces sensing on a fixed 50 ms timer (also active during 2.5s hold checks)
          * **80 MHz CPU Clock:** Lowers ESP32 S2 CPU from 240 MHz to 80 MHz while keeping native USB and 80 MHz APB peripherals at full speed to reduce internal handle heat
          * **OLED Sleep Dimming & Manual Off Timeout:** Dims OLED contrast during sleep and turns off the screen after `time2off` even on double click Off mode
          * **5s Task Watchdog:** Enables `esp_task_wdt` on the main loop so any stall resets cleanly with heater MOSFET off

          ### Binary Files
          * `PTS200___TAG___update.bin`: Drag and drop onto `ESP32-FWMSC` via `Setup` → `Update FW` for normal upgrades
          * `PTS200___TAG___factory.bin`: Full merged flash image starting at `0x0000` for fresh flashes or recovery
          EOF
          gh release create "$VERSION_TAG" \
            "dist/PTS200_${VERSION_TAG}_update.bin" \
            "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --title "$VERSION_TAG" \
            --latest \
            --notes-file dist/release_notes.md
