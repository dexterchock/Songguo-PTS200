name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version matches tag
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYEOF'
          import os, re, sys
          tag = os.environ["VERSION_TAG"]
          with open("SolderingPen_ESP32S2/config.h", "r", encoding="utf-8") as f:
              text = f.read()
          match = re.search(r'^\s*#define\s+VERSION\s+"([^"]+)"', text, re.MULTILINE)
          if not match:
              print("ERROR: #define VERSION not found in SolderingPen_ESP32S2/config.h", file=sys.stderr)
              sys.exit(1)
          cfg_ver = match.group(1)
          if cfg_ver != tag:
              print(f"ERROR: config.h VERSION={cfg_ver!r} does not match tag {tag!r}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified SolderingPen_ESP32S2/config.h VERSION == {cfg_ver}")
          PYEOF

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package release binaries
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp .pio/build/solderingpen/firmware.bin "dist/PTS200_${VERSION_TAG}_update.bin"
          python ~/.platformio/packages/tool-esptoolpy/esptool.py \
            --chip esp32s2 merge_bin \
            -o "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 .pio/build/solderingpen/bootloader.bin \
            0x8000 .pio/build/solderingpen/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/solderingpen/firmware.bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYEOF'
          import os, re
          tag = os.environ["VERSION_TAG"]
          body_lines = []
          in_section = False
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  for raw in f.read().splitlines():
                      stripped = raw.strip()
                      if re.match(r"^##\s+", stripped):
                          heading = stripped[2:].strip()
                          if in_section:
                              break
                          if heading == tag:
                              in_section = True
                              continue
                      elif in_section:
                          body_lines.append(raw)
          body = "\n".join(body_lines).strip()
          if not body:
              body = f"Release {tag} for Songguo PTS200 (`ESP32-S2`, `VERSION_NUM = 500`)."
          notes = (
              f"{body}\n\n"
              "### Binary Files\n"
              f"* `PTS200_{tag}_update.bin`: Drag and drop onto `ESP32-FWMSC` via `Setup` → `Update FW` for normal upgrades\n"
              f"* `PTS200_{tag}_factory.bin`: Full merged flash image starting at `0x0000` for fresh flashes or recovery\n"
          )
          with open("dist/release_notes.md", "w", encoding="utf-8") as out:
              out.write(notes)
          PYEOF
          gh release create "$VERSION_TAG" \
            "dist/PTS200_${VERSION_TAG}_update.bin" \
            "dist/PTS200_${VERSION_TAG}_factory.bin" \
            --title "$VERSION_TAG" \
            --latest \
            --notes-file dist/release_notes.md
