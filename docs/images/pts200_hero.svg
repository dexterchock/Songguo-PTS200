<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 216" width="1160" height="216">
  
  <defs>
    <!-- Matte black anodized aluminum barrel -->
    <linearGradient id="blackBarrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1d21"/>
      <stop offset="14%" stop-color="#3a3e46"/>
      <stop offset="28%" stop-color="#272a30"/>
      <stop offset="56%" stop-color="#141518"/>
      <stop offset="84%" stop-color="#0d0e11"/>
      <stop offset="94%" stop-color="#22252a"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>

    <!-- Recessed window surround -->
    <linearGradient id="windowBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121417"/>
      <stop offset="18%" stop-color="#1e2127"/>
      <stop offset="55%" stop-color="#0c0e11"/>
      <stop offset="88%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#17191e"/>
    </linearGradient>

    <!-- Metallic silver bezel around OLED -->
    <linearGradient id="bezelFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b929c"/>
      <stop offset="40%" stop-color="#585d66"/>
      <stop offset="70%" stop-color="#9ca3ad"/>
      <stop offset="100%" stop-color="#4e535b"/>
    </linearGradient>

    <!-- Keycap surface -->
    <linearGradient id="buttonCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2e35"/>
      <stop offset="35%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>

    <!-- Signature Songguo emerald silicone grip -->
    <linearGradient id="greenGrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#137d51"/>
      <stop offset="12%" stop-color="#2eb87e"/>
      <stop offset="24%" stop-color="#3fd092"/>
      <stop offset="48%" stop-color="#1ea76d"/>
      <stop offset="78%" stop-color="#158454"/>
      <stop offset="92%" stop-color="#0d5b39"/>
      <stop offset="100%" stop-color="#0a462b"/>
    </linearGradient>

    <!-- Machined stainless tip shaft -->
    <linearGradient id="chromeTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="18%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#a8b0ba"/>
      <stop offset="58%" stop-color="#848b95"/>
      <stop offset="80%" stop-color="#bcc4ce"/>
      <stop offset="100%" stop-color="#697079"/>
    </linearGradient>

    <!-- Steel collet band -->
    <linearGradient id="tipCollar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdd3db"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#7c838d"/>
      <stop offset="82%" stop-color="#aeb6c0"/>
      <stop offset="100%" stop-color="#585f68"/>
    </linearGradient>

    <radialGradient id="oledGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1015"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(5, 2)">
    
    <g filter="url(#softShadow)">
      <!-- USB-C left end barrel -->
      <rect x="30" y="64" width="160" height="84" rx="2" fill="url(#blackBarrel)"/>
      <line x1="189" y1="64" x2="189" y2="148" stroke="#090a0c" stroke-width="1.5"/>

      <!-- Recessed OLED housing -->
      <rect x="190" y="64" width="168" height="84" fill="url(#windowBody)"/>
      <rect x="206" y="70" width="136" height="72" rx="2" fill="none" stroke="url(#bezelFrame)" stroke-width="2.5"/>
      <rect x="208" y="72" width="132" height="68" fill="#050709"/>
      <svg x="210" y="74" width="128" height="64" viewBox="0 0 128 64">
        
      <rect x="0" y="0" width="128" height="64" rx="1.5" fill="url(#oledGlow)"/>
      <text x="3" y="13" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600">Set: 260</text>
      <text x="125" y="13" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700">READY</text>
      <text x="64" y="45" text-anchor="middle" fill="#ffffff" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="25" font-weight="700" letter-spacing="1">260</text>
      
      <text x="4" y="59" fill="#d8e3ec" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="600">34.2C</text>
      <text x="124" y="59" text-anchor="end" fill="#d8e3ec" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="600">15.0V</text>
    
    
      </svg>

      <!-- 3 tactile control buttons + PCB legends (+ O -) -->
      <rect x="358" y="64" width="120" height="84" fill="url(#blackBarrel)"/>
      <line x1="358" y1="64" x2="358" y2="148" stroke="#0b0c0f" stroke-width="1.2"/>
      <rect x="372" y="84" width="24" height="16" rx="2.5" fill="url(#buttonCap)" stroke="#3d424b" stroke-width="0.8"/>
      <rect x="406" y="84" width="24" height="16" rx="2.5" fill="url(#buttonCap)" stroke="#3d424b" stroke-width="0.8"/>
      <rect x="440" y="84" width="24" height="16" rx="2.5" fill="url(#buttonCap)" stroke="#3d424b" stroke-width="0.8"/>
      <text x="384" y="122" text-anchor="middle" fill="#c7cdd6" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">+</text>
      <circle cx="418" cy="118.5" r="3.4" fill="none" stroke="#c7cdd6" stroke-width="1.6"/>
      <text x="452" y="121.5" text-anchor="middle" fill="#c7cdd6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700">-</text>

      <!-- Emerald green silicone grip sleeve -->
      <rect x="478" y="57" width="196" height="98" rx="4" fill="url(#greenGrip)"/>
      <rect x="481" y="57" width="3" height="98" rx="1" fill="#0c4d31" opacity="0.45"/>
      <rect x="670" y="57" width="4" height="98" rx="1" fill="#0b472d" opacity="0.45"/>
      <rect x="482" y="64" width="188" height="3" rx="1.5" fill="#7ff2c0" opacity="0.22"/>

      <!-- Stepped black front collar + collet -->
      <rect x="674" y="64" width="60" height="84" fill="url(#blackBarrel)"/>
      <line x1="733" y1="64" x2="733" y2="148" stroke="#363a42" stroke-width="1"/>
      <rect x="734" y="73" width="46" height="66" rx="1.5" fill="url(#blackBarrel)"/>

      <!-- Machined Chrome Soldering Tip -->
      <rect x="780" y="96" width="20" height="20" fill="url(#chromeTip)"/>
      <rect x="800" y="92" width="14" height="28" rx="1" fill="url(#tipCollar)"/>
      <line x1="805" y1="92" x2="805" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
      <rect x="814" y="96" width="234" height="20" fill="url(#chromeTip)"/>
      <rect x="875" y="96" width="5" height="20" fill="#5e656f" opacity="0.45"/>
      <rect x="945" y="96" width="5" height="20" fill="#5e656f" opacity="0.45"/>
      <polygon points="1048,96 1118,106 1048,116" fill="url(#chromeTip)"/>
      <line x1="1048" y1="96" x2="1048" y2="116" stroke="#6f7782" stroke-width="1"/>
    </g>
    
  </g>
</svg>
